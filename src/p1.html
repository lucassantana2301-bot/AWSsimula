/* ============================================================
   CloudQuest — sistema visual "diagrama"
   A linguagem nativa deste assunto é o diagrama de arquitetura:
   canvas com grade, fronteiras tracejadas com etiqueta de canto,
   nós ligados por conectores em ângulo reto, legenda, linha de cota.
   Peso do domínio = largura. Proficiência = altura.
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}

:root{
  --canvas:#E6EAEF; --dot:#C2CAD4; --sheet:#FFF; --sheet2:#F4F6F9; --sunk:#D8DEE6;
  --ink:#0D1319; --ink2:#44505F; --ink3:#606A76;
  --rule:#C8D0DA; --rule2:#9FABB9;
  --az:#0A58B8; --az-s:#DCE9F9; --az-l:#1C71D8;
  --aw:#A24A00; --aw-s:#FAE8D5; --aw-l:#C85D06;
  --go:#0A6346;  --go-s:#D8EEE4;
  --no:#A3122C;  --no-s:#FADFE4;
  --fl:#8A5A00;  --fl-s:#F8EDD2;
  --neutral:#6E7D8D;
  --fs:'ArchivoV',ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;
  --fm:'AzeretV',ui-monospace,SFMono-Regular,Menlo,monospace;
  --lift:0 10px 34px -10px rgba(13,19,25,.32);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#0B1016; --dot:#1E2831; --sheet:#141C24; --sheet2:#1A232C; --sunk:#070B0F;
    --ink:#E8EEF4; --ink2:#9FAEBD; --ink3:#7D8A97;
    --rule:#26323D; --rule2:#3B4958;
    --az:#6DB0F7; --az-s:#10243A; --az-l:#8CC4FF;
    --aw:#F2A05B; --aw-s:#2B1C0E; --aw-l:#FFB777;
    --go:#48D59A;  --go-s:#0C2A1F;
    --no:#FF7F95;  --no-s:#2A1016;
    --fl:#E0B451;  --fl-s:#2A2110;
    --neutral:#7D8C9C;
    --lift:0 10px 34px -10px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --canvas:#0B1016; --dot:#1E2831; --sheet:#141C24; --sheet2:#1A232C; --sunk:#070B0F;
  --ink:#E8EEF4; --ink2:#9FAEBD; --ink3:#7D8A97;
  --rule:#26323D; --rule2:#3B4958;
  --az:#6DB0F7; --az-s:#10243A; --az-l:#8CC4FF;
  --aw:#F2A05B; --aw-s:#2B1C0E; --aw-l:#FFB777;
  --go:#48D59A;  --go-s:#0C2A1F;
  --no:#FF7F95;  --no-s:#2A1016;
  --fl:#E0B451;  --fl-s:#2A2110;
  --neutral:#7D8C9C;
  --lift:0 10px 34px -10px rgba(0,0,0,.75);
}

html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink);
  font:400 16px/1.55 var(--fs);
  -webkit-font-smoothing:antialiased;
  background-color:var(--canvas);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);
  background-size:26px 26px; background-position:-1px -1px; background-attachment:fixed;
}
h1,h2,h3,h4{margin:0;line-height:1.18;font-weight:600;letter-spacing:-.015em}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:var(--az)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid var(--az);outline-offset:2px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;left:-9999px;top:0;z-index:100;padding:9px 14px;background:var(--ink);color:var(--canvas);
  font-weight:600;font-size:13px;text-decoration:none;border-radius:0 0 3px 0}
.skip:focus{left:0}
.t-xs{font-size:12px;line-height:1.45} .t-sm{font-size:13.5px;line-height:1.5}
.t-md{font-size:15.5px;line-height:1.55} .t-lg{font-size:19px;line-height:1.3}
.t-xl{font-size:25px;line-height:1.2} .t-2xl{font-size:33px;line-height:1.1}
.dim{color:var(--ink2)} .dim2{color:var(--ink3)}

/* ---------- trilho superior ---------- */
.rail{
  position:sticky;top:0;z-index:50;background:var(--sheet);
  border-bottom:1px solid var(--rule2);
  display:grid;grid-template-columns:auto 1fr auto;align-items:stretch;
}
.rail-brand{display:flex;align-items:center;gap:8px;padding:0 14px;font-weight:700;letter-spacing:-.025em;font-size:15.5px;border-right:1px solid var(--rule)}
.rail-brand .mk{width:19px;height:19px;flex:none;position:relative}
.rail-brand .mk i{position:absolute;width:8px;height:8px;border:1.5px solid var(--ink)}
.rail-brand .mk i:nth-child(1){left:0;top:0;background:var(--az);border-color:var(--az)}
.rail-brand .mk i:nth-child(2){right:0;bottom:0;background:var(--aw);border-color:var(--aw)}
.rail-brand .mk::after{content:"";position:absolute;left:7px;top:7px;width:6px;height:6px;border-left:1.5px solid var(--ink3);border-bottom:1.5px solid var(--ink3)}
.rail-tabs{display:flex;align-items:stretch}
.rail-tabs button{
  display:flex;align-items:center;gap:6px;padding:11px 14px;font-size:13.5px;font-weight:500;color:var(--ink3);
  border-right:1px solid var(--rule);white-space:nowrap
}
.rail-tabs button:hover{color:var(--ink);background:var(--sheet2)}
.rail-tabs button[aria-current="true"]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2.5px 0 var(--ink)}
.rail-tabs .badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;
  border-radius:9px;background:var(--no);color:#fff;font:600 10.5px/1 var(--fm)}
.rail-inst{display:flex;align-items:stretch}
.inst{display:flex;flex-direction:column;justify-content:center;gap:1px;padding:0 12px;border-left:1px solid var(--rule);min-width:58px}
.inst .k{font-size:9.5px;letter-spacing:.07em;text-transform:lowercase;color:var(--ink3)}
.inst .v{font:600 14px/1 var(--fm);font-variant-numeric:tabular-nums}
.inst.hot .v{color:var(--aw)} .inst.life .v{color:var(--no)}
.daybar{position:sticky;top:43px;z-index:49;height:2px;background:var(--sunk)}
.daybar i{display:block;height:100%;background:var(--go);transition:width .5s ease}
@media(max-width:720px){
  .rail{grid-template-columns:1fr auto;grid-template-areas:"brand inst" "tabs tabs"}
  .rail-brand{grid-area:brand;border-right:0}
  .rail-inst{grid-area:inst}
  .rail-tabs{grid-area:tabs;border-top:1px solid var(--rule)}
  .rail-tabs button{flex:1;justify-content:center;padding:9px 6px;font-size:12.5px}
  .daybar{top:81px}
  .inst{min-width:0;padding:0 9px}
}

/* ---------- canvas ---------- */
.canvas{max-width:1000px;margin:0 auto;padding:24px 16px 56px}
.canvas.doc{max-width:700px;padding-top:0}
.stack>*+*{margin-top:16px}
.stack-lg>*+*{margin-top:30px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spread{display:flex;align-items:baseline;justify-content:space-between;gap:12px}

/* fronteira: a convenção de diagrama (tracejado + etiqueta no canto) */
.bd{position:relative;border:1.5px dashed var(--bd,var(--neutral));border-radius:4px;
  padding:38px 14px 14px;background:color-mix(in srgb,var(--sheet) 62%,transparent)}
@supports not (background:color-mix(in srgb,red 50%,transparent)){ .bd{background:var(--sheet2)} }
.bd-tab{position:absolute;top:-1.5px;left:-1.5px;display:flex;align-items:center;gap:8px;
  padding:6px 13px 6px 10px;background:var(--bd,var(--neutral));color:#fff;
  border-radius:3px 0 7px 0;font-size:12.5px;font-weight:600;max-width:calc(100% + 3px)}
.bd-tab .ix{font:600 11px/1 var(--fm);opacity:.72}
.bd-tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-w{position:absolute;top:8px;right:12px;font:500 11.5px/1 var(--fm);color:var(--ink3)}
.bd[data-s="done"]{--bd:var(--go)}
.bd[data-s="open"]{--bd:var(--az)}
.bd[data-s="open"].aw{--bd:var(--aw)}
.bd[data-s="lock"]{--bd:var(--rule2)}
.bd[data-s="lock"] .node,.bd[data-s="lock"] .bd-tab{opacity:.8}
.bd[data-s="lock"]::after{content:"";position:absolute;inset:0;border-radius:4px;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 11px,color-mix(in srgb,var(--rule2) 16%,transparent) 11px 12px)}

/* fluxo de nós com conectores em ângulo reto */
.flow{display:flex;align-items:stretch;gap:0}
.node{flex:1 1 0;min-width:0;background:var(--sheet);border:1px solid var(--rule2);border-radius:3px;
  display:flex;flex-direction:column;overflow:hidden}
.node[data-s="lock"]{border-style:dashed;background:var(--sheet2)}
.node-h{display:flex;align-items:center;gap:6px;padding:7px 10px;font-size:12.5px;font-weight:600;
  background:var(--nc,var(--sunk));color:var(--ink);border-bottom:1px solid var(--rule2)}
.node[data-s="done"]{--nc:var(--go-s)} .node[data-s="done"] .node-h{color:var(--go)}
.node[data-s="now"]{--nc:var(--az-s)} .node[data-s="now"] .node-h{color:var(--az)}
.node.aw[data-s="now"]{--nc:var(--aw-s)} .node.aw[data-s="now"] .node-h{color:var(--aw)}
.node[data-s="lock"] .node-h{color:var(--ink3)}
.node-h .gl{flex:none;width:13px;height:13px;border:1.6px solid currentColor;border-radius:2px;position:relative}
.node[data-s="done"] .node-h .gl{background:var(--go);border-color:var(--go)}
.node[data-s="done"] .node-h .gl::after{content:"";position:absolute;left:3px;top:.5px;width:4px;height:7px;
  border:solid #fff;border-width:0 1.6px 1.6px 0;transform:rotate(42deg)}
.node[data-s="lock"] .node-h .gl{border-style:dashed}
.node-b{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1;align-items:stretch}
.node-b>.btn{align-self:flex-start}
.node-meta{font:500 11.5px/1.3 var(--fm);color:var(--ink3)}
.node-p{font-size:12.5px;line-height:1.45;color:var(--ink2)}
.node.wide{flex:1.55 1 0}
.conn{flex:0 0 26px;position:relative;align-self:center;height:14px}
.conn::before{content:"";position:absolute;left:0;right:5px;top:50%;height:1.5px;background:var(--rule2)}
.conn::after{content:"";position:absolute;right:2px;top:50%;width:7px;height:7px;
  border-top:1.5px solid var(--rule2);border-right:1.5px solid var(--rule2);transform:translateY(-50%) rotate(45deg)}
@media(max-width:900px){
  .flow{flex-direction:column}
  /* em coluna, flex-basis 0 colapsaria a altura do nó e overflow:hidden cortaria o conteúdo */
  .node,.node.wide{flex:0 0 auto}
  .conn{flex:0 0 22px;height:22px;width:14px;align-self:flex-start;margin-left:20px}
  .conn::before{left:50%;right:auto;top:0;bottom:5px;height:auto;width:1.5px}
  .conn::after{right:auto;left:50%;top:auto;bottom:2px;transform:translateX(-50%) rotate(135deg)}
}
/* trilha de certificações: fluxo sempre vertical */
.flow.vert{flex-direction:column}
.flow.vert .node,.flow.vert .node.wide{flex:0 0 auto}
.flow.vert .conn{flex:0 0 22px;height:22px;width:14px;align-self:flex-start;margin-left:22px}
.flow.vert .conn::before{left:50%;right:auto;top:0;bottom:5px;height:auto;width:1.5px}
.flow.vert .conn::after{right:auto;left:50%;top:auto;bottom:2px;transform:translateX(-50%) rotate(135deg)}
.node-h .st{margin-left:auto;font:500 10.5px/1 var(--fm);color:var(--ink2);text-transform:uppercase;letter-spacing:.04em}
.node-h .lv{font:500 10.5px/1 var(--fm);color:var(--ink2);padding:2px 5px;border:1px solid var(--rule2);border-radius:2px}

/* metas: seletor de objetivo */
.goals{display:flex;flex-wrap:wrap;gap:7px}
.goals button{display:flex;align-items:center;gap:7px;padding:7px 11px;font:inherit;font-size:12.5px;
  background:var(--sheet);border:1px solid var(--rule2);border-radius:2px;color:var(--ink2);cursor:pointer}
.goals button:hover{border-color:var(--ink3);color:var(--ink)}
.goals button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--canvas);font-weight:600}
.goals button .ic{font-size:13px;line-height:1}

/* marcar situação de uma certificação */
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:2px;overflow:hidden;align-self:flex-start}
.seg button{font:inherit;font-size:11.5px;padding:5px 9px;background:var(--sheet);border:0;
  border-right:1px solid var(--rule2);color:var(--ink3);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--sheet2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--canvas);font-weight:600}
.seg button[aria-pressed="true"][data-v="done"]{background:var(--go);color:#fff}

/* catálogo completo */
.catg{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:10px}
.catc{border:1px solid var(--rule2);border-radius:3px;background:var(--sheet);padding:11px 12px;
  display:flex;flex-direction:column;gap:6px;text-align:left}
.catc[data-has="1"]{border-color:var(--az)}
.catc.aw[data-has="1"]{border-color:var(--aw)}
.catc .cd{font:600 11.5px/1 var(--fm);letter-spacing:.03em}
.catc .nm{font-size:13px;font-weight:600;line-height:1.3}
.catc .fo{font-size:11.5px;line-height:1.45;color:var(--ink2)}
.catc dl{display:grid;grid-template-columns:auto 1fr;gap:1px 8px;font-size:11px;margin-top:2px}
.catc dt{color:var(--ink3)} .catc dd{color:var(--ink2);text-align:right}
@media(max-width:560px){.catg{grid-template-columns:1fr}}

/* etiquetas de trilha em uma certificação */
.trs{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.trs .lb{font:500 10px/1 var(--fm);color:var(--ink3);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
.trs .tr{display:inline-flex;align-items:center;gap:4px;font-size:11px;line-height:1;padding:5px 8px;
  border:1px solid var(--rule2);border-radius:2px;color:var(--ink2);background:var(--sheet2)}
.trs .tr.on{border-color:var(--ink);color:var(--ink);font-weight:600}
.trs .tr .ic{font-size:10px}
button.tr{font:inherit;font-size:11px;cursor:pointer}
button.tr:hover{border-color:var(--ink3);color:var(--ink)}

/* barra de progresso da trilha */
.tbar{height:5px;background:var(--sunk);border:1px solid var(--rule);border-radius:2px;overflow:hidden;display:flex}
.tbar i{display:block;background:var(--go)}
.tbar i.d{background:var(--az)}

/* itens dentro de um nó */
.lst{border:1px solid var(--rule);border-radius:2px;overflow:hidden;background:var(--sheet)}
.lst-i{display:flex;align-items:flex-start;gap:8px;width:100%;padding:7px 9px;border-bottom:1px solid var(--rule);font-size:12.5px}
.lst-i:last-child{border-bottom:0}
.lst-i:hover:not(:disabled){background:var(--sheet2)}
.lst-i .bx{flex:none;margin-top:2px;width:12px;height:12px;border:1.5px solid var(--rule2);border-radius:2px;position:relative}
.lst-i[data-done="1"] .bx{background:var(--go);border-color:var(--go)}
.lst-i[data-done="1"] .bx::after{content:"";position:absolute;left:3px;top:0;width:3.5px;height:6.5px;
  border:solid #fff;border-width:0 1.5px 1.5px 0;transform:rotate(42deg)}
.lst-i .nm{flex:1;min-width:0;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.lst-i .tm{font:400 10.5px/1 var(--fm);color:var(--ink3);flex:none}
.lst-i:disabled{opacity:.55}

/* legenda do diagrama */
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:9px 12px;border:1px solid var(--rule);
  border-radius:3px;background:var(--sheet);font-size:11.5px;color:var(--ink2)}
.legend .lg{display:flex;align-items:center;gap:6px}
.legend .m{width:11px;height:11px;border-radius:2px;border:1.5px solid var(--rule2);flex:none}
.legend .m.done{background:var(--go);border-color:var(--go)}
.legend .m.now{background:var(--az-s);border-color:var(--az)}
.legend .m.lock{border-style:dashed;background:var(--sheet2)}

/* ---------- linha de cota (prontidão) ---------- */
.dimline{padding:30px 0 6px;position:relative}
.dl-track{position:relative;height:0;border-top:1.5px solid var(--ink2)}
.dl-track::before,.dl-track::after{content:"";position:absolute;top:-7px;width:1.5px;height:15px;background:var(--ink2)}
.dl-track::before{left:0} .dl-track::after{right:0}
.dl-fill{position:absolute;top:-4px;height:8px;left:0;background:var(--az);opacity:.9}
.dimline.aw .dl-fill{background:var(--aw)}
.dl-cut{position:absolute;top:-13px;height:28px;width:1.5px;background:var(--ink);z-index:2}
.dl-cut b{position:absolute;top:16px;left:50%;transform:translateX(-50%);font:600 10.5px/1 var(--fm);
  color:var(--ink);white-space:nowrap;background:var(--sheet);padding:2px 5px;border:1px solid var(--rule2);border-radius:2px}
.dl-val{position:absolute;bottom:8px;transform:translateX(-50%);z-index:3;transition:left .8s cubic-bezier(.22,1,.3,1)}
.dl-val b{display:block;font:600 13px/1 var(--fm);background:var(--ink);color:var(--canvas);
  padding:4px 8px;border-radius:2px;white-space:nowrap}
.dl-val b.ok{background:var(--go);color:#fff}
.dl-val::after{content:"";position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);
  border:5px solid transparent;border-top-color:var(--ink)}
.dl-val.ok::after{border-top-color:var(--go)}
.dl-sc{display:flex;justify-content:space-between;margin-top:20px;font:400 10.5px/1 var(--fm);color:var(--ink3)}
.dl-band{position:absolute;top:-4px;height:8px;background:var(--az-s);border-left:1px solid var(--az);border-right:1px solid var(--az)}
.dimline.aw .dl-band{background:var(--aw-s);border-color:var(--aw)}

/* ---------- barras de peso ---------- */
.bands{display:flex;gap:3px;height:64px}
.band{position:relative;display:block;background:var(--sheet);border:1px solid var(--rule2);border-radius:2px;
  overflow:hidden;min-width:0;flex-basis:0;padding:0}
.band:hover{border-color:var(--ink2)}
.band i{position:absolute;left:0;right:0;bottom:0;background:var(--az);opacity:.85;transition:height .7s cubic-bezier(.2,.8,.3,1)}
.band.aw i{background:var(--aw)}
.band[data-lock="1"]{opacity:.5}
.band span{position:absolute;inset:0;padding:5px 7px;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}
.band .d{font:600 10.5px/1 var(--fm)}
.band .v{font:500 10.5px/1 var(--fm);color:var(--ink2)}

/* ---------- controles ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:2px;
  font-size:13.5px;font-weight:600;border:1.5px solid var(--ink);background:var(--sheet);color:var(--ink);
  transition:background .12s,color .12s}
.btn:hover:not(:disabled){background:var(--ink);color:var(--canvas)}
.btn.fill{background:var(--ink);color:var(--canvas)}
.btn.fill:hover:not(:disabled){background:var(--ink2);border-color:var(--ink2)}
.btn.az{background:var(--az);border-color:var(--az);color:#fff} .btn.az:hover:not(:disabled){background:var(--az-l);border-color:var(--az-l)}
.btn.aw{background:var(--aw);border-color:var(--aw);color:#fff} .btn.aw:hover:not(:disabled){background:var(--aw-l);border-color:var(--aw-l)}
.btn.go{background:var(--go);border-color:var(--go);color:#fff} .btn.go:hover:not(:disabled){filter:brightness(1.14)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2);padding-left:6px;padding-right:6px}
.btn.ghost:hover:not(:disabled){background:transparent;color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.wide{width:100%}
@media(prefers-color-scheme:dark){ :root:not([data-theme="light"]) .btn.az,:root:not([data-theme="light"]) .btn.aw,:root:not([data-theme="light"]) .btn.go{color:#08121a} }
:root[data-theme="dark"] .btn.az,:root[data-theme="dark"] .btn.aw,:root[data-theme="dark"] .btn.go{color:#08121a}
/* precisa vir depois das variantes de cor: senão .btn.az venceria e um
   botão bloqueado continuaria parecendo disponível */
.btn:disabled,.btn.az:disabled,.btn.aw:disabled,.btn.go:disabled,.btn.fill:disabled{
  background:var(--sheet2);border-color:var(--rule2);color:var(--ink3);filter:none}

.gab[data-f="no"] .gab-i[data-ok="1"],.gab[data-f="flag"] .gab-i[data-flag="0"]{display:none}
.gab{display:flex;flex-direction:column;gap:12px}
[data-act="simfilter"][aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.pront-top{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin:4px 0 10px}
.pront-v{font-size:26px;font-weight:700;letter-spacing:-.01em;line-height:1.15}
.pront-v.go{color:var(--go)} .pront-v.fl{color:var(--ink)}
.pront-c{list-style:none;margin:0;padding:0;flex:1;min-width:220px;display:flex;flex-direction:column;gap:5px}
.pront-c li{display:flex;gap:8px;font-size:13px;line-height:1.35;color:var(--ink2)}
.pront-c li[data-ok="1"]{color:var(--ink)}
.pront-c .ic{width:18px;height:18px;flex:none;display:inline-grid;place-items:center;border:1px solid var(--rule2);border-radius:50%;font-size:11px;font-weight:700}
.pront-c li[data-ok="1"] .ic{background:var(--go);border-color:var(--go);color:var(--sheet)}
.ch-wrap{margin-top:4px}
.ch{width:100%;max-width:520px;height:auto;display:block;overflow:visible}
.ch-grid{stroke:var(--rule);stroke-width:1}
.ch-ref{stroke:var(--ink3);stroke-width:1}
.ch-tx{fill:var(--ink3);font-size:11px;font-family:inherit}
.ch-val{fill:var(--ink);font-size:13px;font-weight:700;font-family:inherit}
.ch-line{fill:none;stroke:var(--aw);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ch-dot{fill:var(--aw);stroke:var(--sheet);stroke-width:2}
.ch-dot-o{fill:var(--sheet);stroke:var(--aw);stroke-width:2}
.ch-hit{fill:transparent}
.ch-pt{cursor:default;outline:none}
.ch-pt:focus-visible .ch-hit{stroke:var(--ink);stroke-width:1.5}
.ch-key{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.k-full,.k-short{display:inline-block;width:9px;height:9px;border-radius:50%;border:2px solid var(--aw)}
.k-full{background:var(--aw)} .k-short{background:var(--sheet);margin-left:8px}
.ch.az .ch-line{stroke:var(--az)} .ch.az .ch-dot{fill:var(--az)} .ch.az .ch-dot-o{stroke:var(--az)}
.ch-wrap.az .k-full,.ch-wrap.az .k-short{border-color:var(--az)} .ch-wrap.az .k-full{background:var(--az)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lst-i .xt{display:inline-block;margin-left:4px;padding:0 5px;border:1px solid var(--rule2);border-radius:3px;font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--ink2);vertical-align:1px;white-space:nowrap}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 7px;border:1px solid var(--rule2);
  border-radius:2px;font-size:11px;font-weight:500;color:var(--ink2);background:var(--sheet)}
.tag.az{color:var(--az);border-color:var(--az);background:var(--az-s)}
.tag.aw{color:var(--aw);border-color:var(--aw);background:var(--aw-s)}
.tag.go{color:var(--go);border-color:var(--go);background:var(--go-s)}
.tag.no{color:var(--no);border-color:var(--no);background:var(--no-s)}
.tag.fl{color:var(--fl);border-color:var(--fl);background:var(--fl-s)}

.sheet{background:var(--sheet);border:1px solid var(--rule2);border-radius:3px;padding:16px}
.sheet.tight{padding:12px}
.hd{display:flex;align-items:baseline;gap:9px;margin-bottom:11px}
.hd h2{font-size:17px} .hd .n{font:400 11px/1 var(--fm);color:var(--ink3)}

/* ---------- cartões de exame como fronteiras ---------- */
.exams{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.exam{display:block;width:100%;text-align:left;padding:0;border:0;background:none}
.exam .bd{transition:border-color .14s}
.exam:hover:not(:disabled) .bd,.exam:focus-visible .bd{border-style:solid}
.exam[data-soon="1"]{opacity:.6}
.exam[data-soon="1"] .bd{padding:32px 14px 12px}
.exam h3{font-size:17px;margin-bottom:3px}
.exam .facts{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;margin-top:11px;font-size:12.5px}
.exam .facts dt{color:var(--ink3)} .exam .facts dd{margin:0;font-family:var(--fm);font-size:11.5px}

/* ---------- leitor: folha sobre o canvas ---------- */
.reader{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;background:var(--canvas);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:26px 26px}
.rd-top{display:flex;align-items:center;gap:10px;padding:8px 13px;background:var(--sheet);border-bottom:1px solid var(--rule2)}
.rd-top h2{font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rd-prog{height:2px;background:var(--sunk)}
.rd-prog i{display:block;height:100%;background:var(--az);width:0;transition:width .12s linear}
.rd-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:18px 14px 30px}
.rd-foot{display:flex;gap:10px;align-items:center;padding:10px 13px calc(10px + env(safe-area-inset-bottom));
  background:var(--sheet);border-top:1px solid var(--rule2)}
.rd-foot .hint{font-size:12px;color:var(--ink3);flex:1}
.paper{max-width:66ch;margin:0 auto;background:var(--sheet);border:1px solid var(--rule2);
  border-radius:2px;box-shadow:var(--lift);padding:30px 30px 34px}
.paper h1{font-size:26px;margin-bottom:10px;letter-spacing:-.025em}
.paper .lead{font-size:17px;line-height:1.55;color:var(--ink2);margin-bottom:6px}
.paper .meta{display:flex;gap:8px;align-items:center;margin-bottom:18px;padding-bottom:13px;border-bottom:1.5px solid var(--ink)}
.paper h3{font-size:16px;margin:24px 0 8px;padding-left:11px;border-left:3px solid var(--ink)}
.paper p{margin:0 0 11px;font-size:15.5px;line-height:1.65}
.paper table{width:100%;border-collapse:collapse;font-size:13.5px}
.paper th{text-align:left;font-weight:600;font-size:12px;color:var(--ink);padding:6px 9px;
  border-bottom:1.5px solid var(--ink);vertical-align:bottom}
.paper td{padding:7px 9px;border-bottom:1px solid var(--rule);vertical-align:top;line-height:1.45}
.paper tr:last-child td{border-bottom:0}
.paper td:first-child{font-weight:600}
.wrap-t{overflow-x:auto;margin:2px 0 16px;border:1px solid var(--rule2);border-radius:2px}
.bx{border-radius:2px;padding:12px 14px;margin:2px 0 16px;font-size:14px;line-height:1.55}
.bx .lbl{font:600 11px/1 var(--fm);letter-spacing:.06em;margin-bottom:6px;display:block}
.bx.trap{background:var(--fl-s);border:1px solid var(--fl);border-left-width:3px}
.bx.trap .lbl{color:var(--fl)}
.bx.case{background:var(--sheet2);border:1px solid var(--rule2);border-left:3px solid var(--az)}
.bx.case .q{font-weight:600;margin-bottom:8px} .bx.case .a{color:var(--ink2)}
.bx.check{background:var(--go-s);border:1px solid var(--go);border-left-width:3px}
.bx.check .lbl{color:var(--go)}
.bx.check li{position:relative;padding-left:17px;margin-top:5px}
.bx.check li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;background:var(--go)}
.srcs{display:flex;flex-wrap:wrap;gap:6px}
.srcs a{font-size:12px;text-decoration:none;border:1px solid var(--rule2);border-radius:2px;padding:3px 8px;background:var(--sheet2)}
.srcs a:hover{border-color:var(--az)}

/* ---------- aula ---------- */
.player{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:var(--canvas);
  background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:26px 26px}
.pl-segs{display:flex;gap:3px;padding:9px 13px 0;background:var(--sheet)}
.pl-segs i{flex:1;height:3px;background:var(--sunk);overflow:hidden;position:relative}
.pl-segs i.seen{background:var(--az)}
.pl-segs i.now span{position:absolute;inset:0;background:var(--az);transform-origin:left;transform:scaleX(0)}
@keyframes fill{to{transform:scaleX(1)}}
.pl-top{display:flex;align-items:center;gap:10px;padding:8px 13px;background:var(--sheet);border-bottom:1px solid var(--rule2)}
.pl-stage{flex:1;overflow-y:auto;display:grid;place-items:center;padding:18px 16px}
.slide{max-width:600px;width:100%;text-align:center;background:var(--sheet);border:1px solid var(--rule2);
  border-radius:3px;box-shadow:var(--lift);padding:26px 24px}
.slide .kind{font:500 11px/1 var(--fm);letter-spacing:.08em;color:var(--ink3);margin-bottom:12px}
.slide h2{font-size:24px;margin-bottom:11px}
.slide p{font-size:16px;line-height:1.6;color:var(--ink2)}
.slide .emo{font-size:38px;line-height:1;margin-bottom:10px}
.slide svg{max-width:100%;height:auto;margin:4px 0}
.pl-ctrl{display:flex;gap:8px;align-items:center;padding:10px 13px calc(10px + env(safe-area-inset-bottom));
  background:var(--sheet);border-top:1px solid var(--rule2)}
.cc{min-height:38px;display:grid;place-items:center;padding:7px 14px;background:var(--sheet2);
  border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink2);text-align:center}
.lq{display:grid;gap:7px;margin-top:14px;text-align:left}
.dp{opacity:0;animation:dp .45s ease forwards}
@keyframes dp{to{opacity:1;transform:none}}
.dw{stroke-dasharray:600;stroke-dashoffset:600;animation:dw 1.4s ease forwards}
@keyframes dw{to{stroke-dashoffset:0}}

/* ---------- baralhos e desafios ---------- */
.buckets{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.bucket{padding:14px 12px;text-align:center;font-size:15px;font-weight:600;background:var(--sheet);
  border:1.5px solid var(--rule2);border-radius:3px;transition:background .12s,border-color .12s}
.bucket:hover:not(:disabled){background:var(--sheet2);border-color:var(--ink2)}
.bucket.ok{background:var(--go-s);border-color:var(--go);color:var(--go)}
.bucket.bad{background:var(--no-s);border-color:var(--no);color:var(--no)}
.bucket:disabled{opacity:.75}
.decks{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.deckcard{display:flex;flex-direction:column;gap:5px;align-items:flex-start;padding:12px;
  background:var(--sheet);border:1px solid var(--rule2);border-radius:3px;transition:border-color .12s}
.deckcard:hover{border-color:var(--ink2)}
.deckcard b{font-size:14.5px;line-height:1.25}
.grid2{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--ink2)}
.fld select{font:inherit;font-size:14px;padding:8px 9px;border:1px solid var(--rule2);border-radius:2px;
  background:var(--sheet);color:var(--ink)}
#ch-link,#jsonbox{width:100%;min-height:62px;font:12px/1.45 var(--fm);padding:9px;
  border:1px solid var(--rule2);border-radius:2px;background:var(--sheet2);color:var(--ink);resize:vertical}
#ch-link{display:block}

/* ---------- cartões de memorização ---------- */
.card3{position:relative;min-height:220px;display:grid;place-items:center;padding:28px 24px;
  background:var(--sheet);border:1px solid var(--rule2);border-radius:3px;box-shadow:var(--lift);text-align:center}
.card3 .face{font-size:19px;line-height:1.45;font-weight:500;max-width:46ch}
.card3 .side{position:absolute;top:10px;left:12px;font:500 10.5px/1 var(--fm);letter-spacing:.07em;color:var(--ink3)}
.card3 .src{position:absolute;bottom:10px;left:12px;right:12px;font-size:11.5px;color:var(--ink3)}
.card3.back{background:var(--go-s);border-color:var(--go)}
.card3.back .face{color:var(--ink);font-weight:600}
.cardbar{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.cardprog{flex:1;min-width:90px;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.cardprog i{display:block;height:100%;background:var(--ink)}

/* ---------- questões ---------- */
.q-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.q-case{background:var(--sheet2);border:1px solid var(--rule2);border-left:3px solid var(--neutral);
  border-radius:2px;padding:11px 13px;margin-bottom:12px;font-size:14px;line-height:1.6;color:var(--ink2);white-space:pre-wrap}
.q-stem{font-size:16.5px;line-height:1.5;font-weight:500;white-space:pre-wrap}
.opts{display:grid;gap:6px;margin:13px 0}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;padding:10px 12px;background:var(--sheet);
  border:1px solid var(--rule2);border-left-width:3px;border-radius:2px;font-size:14.5px;line-height:1.45}
.opt:hover:not(:disabled){background:var(--sheet2);border-left-color:var(--ink2)}
.opt .k{flex:none;width:19px;height:19px;display:grid;place-items:center;font:600 11px/1 var(--fm);
  background:var(--sheet2);border:1px solid var(--rule2);border-radius:2px;color:var(--ink2)}
.opt[data-sel="1"]{border-left-color:var(--az);background:var(--az-s)}
.opt[data-sel="1"] .k{background:var(--az);border-color:var(--az);color:#fff}
.opt[data-res="ok"]{border-color:var(--go);border-left-color:var(--go);background:var(--go-s)}
.opt[data-res="ok"] .k{background:var(--go);border-color:var(--go);color:#fff}
.opt[data-res="bad"]{border-color:var(--no);border-left-color:var(--no);background:var(--no-s)}
.opt[data-res="bad"] .k{background:var(--no);border-color:var(--no);color:#fff}
.opt[data-res="miss"]{border-left-color:var(--go);border-left-style:dashed}
.yn{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;background:var(--sheet);
  border:1px solid var(--rule2);border-left-width:3px;border-radius:2px;font-size:14px;line-height:1.45}
.yn .tx{flex:1;min-width:0}
.yn[data-res="ok"]{border-left-color:var(--go);background:var(--go-s)}
.yn[data-res="bad"]{border-left-color:var(--no);background:var(--no-s)}
.yn-b{display:flex;gap:4px;flex:none}
.yn-b button{padding:4px 11px;border:1px solid var(--rule2);border-radius:2px;font-size:12px;font-weight:600;color:var(--ink2);background:var(--sheet)}
.yn-b button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.yn-e{font-size:12.5px;line-height:1.5;margin-top:6px;color:var(--ink2)}
.ord{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--sheet);
  border:1px solid var(--rule2);border-left-width:3px;border-radius:2px;font-size:14px}
.ord .pos{flex:none;width:21px;height:21px;background:var(--ink);color:var(--canvas);display:grid;place-items:center;font:600 11.5px/1 var(--fm)}
.ord .tx{flex:1;min-width:0;line-height:1.4}
.ord[data-res="ok"]{border-left-color:var(--go);background:var(--go-s)}
.ord[data-res="bad"]{border-left-color:var(--no);background:var(--no-s)}
.ord-mv{display:flex;flex-direction:column;gap:2px;flex:none}
.ord-mv button{width:22px;height:16px;border:1px solid var(--rule2);display:grid;place-items:center;font-size:8px;color:var(--ink2)}
.verdict{border-radius:2px;padding:14px;margin-top:13px;border-left-width:3px}
.verdict.ok{background:var(--go-s);border:1px solid var(--go);border-left-width:3px}
.verdict.no{background:var(--no-s);border:1px solid var(--no);border-left-width:3px}
.verdict h4{font-size:14.5px;margin-bottom:7px}
.verdict.ok h4{color:var(--go)} .verdict.no h4{color:var(--no)}
.verdict .why{font-size:14px;line-height:1.6}
.wrongs{display:grid;gap:5px;margin-top:11px}
.wrong{display:flex;gap:8px;font-size:13px;line-height:1.55;color:var(--ink2);padding:7px 9px;
  background:var(--sheet);border:1px solid var(--rule);border-radius:2px}
.wrong b{flex:none;font-family:var(--fm);color:var(--ink)}

/* ---------- simulado ---------- */
.sim-bar{display:flex;align-items:center;gap:9px;padding:9px 12px;background:var(--sheet);
  border:1px solid var(--rule2);border-radius:3px;margin-bottom:14px;flex-wrap:wrap;position:sticky;top:46px;z-index:30}
.clock{font:600 16px/1 var(--fm);padding:5px 9px;background:var(--sheet2);border:1px solid var(--rule2);border-radius:2px;font-variant-numeric:tabular-nums}
.clock.warn{color:var(--fl);border-color:var(--fl)} .clock.crit{color:var(--no);border-color:var(--no)}
.qnav{display:flex;gap:3px;flex-wrap:wrap;margin-top:12px}
.qnav button{width:28px;height:28px;border:1px solid var(--rule2);border-radius:2px;font:600 11.5px/1 var(--fm);color:var(--ink2);background:var(--sheet)}
.qnav button[data-st="ans"]{border-color:var(--az);color:var(--az)}
.qnav button[data-st="flag"]{border-color:var(--fl);color:var(--fl);background:var(--fl-s)}
.qnav button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--canvas)}
.result{display:grid;gap:3px;padding:22px;background:var(--sheet);border:1.5px solid var(--ink);border-radius:3px;text-align:center}
.result .big{font:600 50px/1 var(--fm);letter-spacing:-.045em;font-variant-numeric:tabular-nums}
.result .big.ok{color:var(--go)} .result .big.no{color:var(--no)}
.domrows{display:grid;gap:10px}
.domrow .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.domrow .t b{font-family:var(--fm);font-weight:600}
.meter{height:6px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;transition:width .6s ease}
.meter i.hi{background:var(--go)} .meter i.mid{background:var(--fl)} .meter i.lo{background:var(--no)}

/* ---------- equivalências ---------- */
.eq{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:8px;padding:10px 12px;
  background:var(--sheet);border:1px solid var(--rule2);border-radius:2px}
.eq .s{min-width:0}
.eq .s b{font-size:13.5px;font-weight:600;display:block}
.eq .s span{font-size:11.5px;color:var(--ink3);display:block;margin-top:2px;line-height:1.4}
.eq .l b{color:var(--az)} .eq .r b{color:var(--aw)} .eq .r{text-align:right}
.eq .mid{position:relative;height:12px}
.eq .mid::before{content:"";position:absolute;left:0;right:5px;top:50%;height:1.5px;background:var(--rule2)}
.eq .mid::after{content:"";position:absolute;right:1px;top:50%;width:6px;height:6px;
  border-top:1.5px solid var(--rule2);border-right:1.5px solid var(--rule2);transform:translateY(-50%) rotate(45deg)}
@media(max-width:560px){ .eq{grid-template-columns:1fr} .eq .r{text-align:left} .eq .mid{display:none} }

.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:8px}
.ach{padding:11px;border:1px solid var(--rule2);border-radius:2px;background:var(--sheet)}
.ach[data-on="0"]{opacity:.42;border-style:dashed}
.ach .e{font-size:20px;line-height:1}
.ach .t{font-size:12.5px;font-weight:600;margin-top:6px}
.ach .d{font-size:11px;color:var(--ink3);margin-top:2px;line-height:1.4}

.note{font-size:12px;line-height:1.6;color:var(--ink2);background:var(--sheet);border:1px solid var(--rule);
  border-left:3px solid var(--rule2);border-radius:2px;padding:12px 14px}
.note b{color:var(--ink)}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;
  flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:calc(100% - 26px);max-width:400px}
.toast{padding:8px 14px;border-radius:2px;font-size:13px;font-weight:600;background:var(--ink);color:var(--canvas);
  box-shadow:var(--lift);animation:tin .22s ease both}
.toast.ok{background:var(--go);color:#fff} .toast.no{background:var(--no);color:#fff} .toast.fl{background:var(--fl);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.enter{animation:en .28s ease both}
@keyframes en{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

@media print{
  body{background:#fff !important;color:#000;font-size:11pt}
  .rail,.daybar,.rd-top,.rd-prog,.rd-foot,.toasts,.nav,.skip{display:none !important}
  .reader{position:static;inset:auto;background:#fff;display:block}
  .rd-body{overflow:visible;padding:0}
  .paper{box-shadow:none;border:0;max-width:none;padding:0}
  .paper h3{break-after:avoid;page-break-after:avoid}
  .wrap-t,.bx,table,tr{break-inside:avoid;page-break-inside:avoid}
  .srcs a::after{content:" (" attr(href) ")";font-size:9pt;color:#444}
  a{color:#000;text-decoration:none}
}
/* ================================================================
   MOVIMENTO — vocabulário de infraestrutura
   provisionar: a borda é traçada em volta do recurso até fechar
   pacote: um quadrado atravessa o conector até o nó seguinte
   Só anima o que mudou desde o render anterior (ver p8-motion.js).
   ================================================================ */
:root{--e-out:cubic-bezier(.2,.8,.2,1);--e-io:cubic-bezier(.65,0,.35,1);--t-pk:.42s;--t-tr:.62s}
.fx-host{position:relative}
.fx-trace{position:absolute;left:0;top:0;pointer-events:none;z-index:5;overflow:visible;
  animation:fx-out .45s ease forwards;animation-delay:calc(var(--d,0ms) + var(--t-tr) + 260ms)}
.fx-trace path{fill:none;stroke:var(--pc,var(--go));stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter;
  stroke-dasharray:1 1;stroke-dashoffset:1;animation:fx-draw var(--t-tr) var(--e-io) forwards;animation-delay:var(--d,0ms)}
@keyframes fx-draw{to{stroke-dashoffset:0}}
@keyframes fx-out{to{opacity:0}}
/* o glifo de estado do nó acende junto com o fim do traço */
.fx-host>.node-h .gl{animation:fx-pop .34s var(--e-out) both;animation-delay:calc(var(--d,0ms) + var(--t-tr) - 120ms)}
@keyframes fx-pop{0%{transform:scale(.5)}70%{transform:scale(1.18)}100%{transform:none}}

/* pacote em trânsito no conector */
.conn{position:relative}
.fx-pk{position:absolute;width:8px;height:8px;border-radius:1.5px;z-index:3;pointer-events:none;
  background:var(--pc,var(--az));box-shadow:0 0 0 3px color-mix(in srgb,var(--pc,var(--az)) 24%,transparent);
  top:50%;left:0;transform:translate(-50%,-50%);
  animation:fx-pkh var(--t-pk) var(--e-io) both;animation-delay:var(--d,0ms)}
@keyframes fx-pkh{0%{left:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{left:calc(100% - 3px);opacity:0}}
@keyframes fx-pkv{0%{top:0;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:calc(100% - 3px);opacity:0}}
.flow.vert .fx-pk{left:50%;top:0;animation-name:fx-pkv}
@media(max-width:900px){.flow .fx-pk{left:50%;top:0;animation-name:fx-pkv}}

/* trilha: a rota se desenha uma vez, de cima para baixo (o único momento orquestrado) */
.route-in>.node{animation:fx-node .38s var(--e-out) both;animation-delay:calc(var(--i)*130ms)}
.route-in>.conn{transform-origin:top center;animation:fx-conn .18s linear both;animation-delay:calc(var(--i)*130ms - 50ms)}
@keyframes fx-node{from{opacity:0;clip-path:inset(0 0 100% 0)}to{opacity:1;clip-path:inset(0 0 0 0)}}
@keyframes fx-conn{from{transform:scaleY(0)}to{transform:none}}

/* resposta: o que mudou ao confirmar */
[data-fx~="check"] .opt[data-res="bad"],[data-fx~="check"] .yn[data-res="bad"],
[data-fx~="check"] .ord[data-res="bad"],[data-fx~="check"] .bucket.bad{animation:fx-nope .34s var(--e-out)}
@keyframes fx-nope{18%{transform:translateX(-5px)}42%{transform:translateX(4px)}66%{transform:translateX(-2px)}100%{transform:none}}
[data-fx~="check"] .verdict{animation:fx-open .34s var(--e-out) both .14s}
@keyframes fx-open{from{clip-path:inset(0 0 100% 0)}to{clip-path:inset(0 0 0 0)}}

/* cartão: vira de verdade */
[data-fx~="flip"] .card3.back{animation:fx-flip .4s var(--e-out) both}
@keyframes fx-flip{from{transform:perspective(900px) rotateY(-96deg);opacity:.35}to{transform:perspective(900px) rotateY(0)}}

/* XP subindo no instrumento */
.inst .v{font-variant-numeric:tabular-nums}
.inst.fx-tick .v{animation:fx-tick .7s var(--e-out)}
@keyframes fx-tick{0%{color:var(--go)}100%{color:inherit}}

/* troca de tela: o código do exame viaja do cartão para o cabeçalho */
::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}
::view-transition-group(*){animation-duration:.32s;animation-timing-function:var(--e-out)}

@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:1ms !important;animation-delay:0ms !important;transition-duration:1ms !important;transition-delay:0ms !important}}
@media(max-width:560px){
  .canvas{padding:16px 12px 48px}
  .paper{padding:22px 18px 26px}
  .paper h1{font-size:22px}
  .slide{padding:20px 16px}
  .slide h2{font-size:21px}
  .bd{padding:36px 11px 11px}
  .bands{height:56px}
  .spread{flex-wrap:wrap}
  .hd{flex-wrap:wrap;gap:3px 9px}
}

<script>
"use strict";
