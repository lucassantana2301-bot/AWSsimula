# Overlay do kind: imagens locais (carregadas com "kind load") e porta fixa
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
images:
  - { name: cloudquest-api, newName: cloudquest-api, newTag: local }
  - { name: cloudquest-web, newName: cloudquest-web, newTag: local }
patches:
  - target: { kind: Service, name: web }
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
