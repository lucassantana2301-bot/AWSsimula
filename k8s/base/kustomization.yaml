apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudquest
resources:
  - namespace.yaml
  - api.yaml
  - web.yaml
  - disponibilidade.yaml
  - rede.yaml
configMapGenerator:
  - name: cloudquest-config
    literals:
      - PUBLIC_ORIGIN=http://localhost:8080
      # a NetworkPolicy só deixa o web falar com a API: o X-Real-IP do nginx é confiável
      - TRUST_PROXY=1
