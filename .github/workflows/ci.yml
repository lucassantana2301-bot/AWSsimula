name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qualidade:
    name: Tipos, lint, conteúdo e testes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vulnerabilidades em dependências de produção
        run: npm run audit:prod
      - name: Tipos (TypeScript estrito)
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Formatação
        run: npm run format:check
      - name: Conteúdo, testes de unidade e de propriedade, com cobertura mínima
        run: npm run test:coverage
      - name: Suítes legadas (lógica, DOM, guia)
        run: npm run test:legacy
      - name: Build
        run: npm run build
      - name: Orçamento de tamanho
        run: npm run size
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          # dist/.vite/manifest.json é lido pelos testes de navegador (chunks sob demanda)
          include-hidden-files: true
          retention-days: 7

  funcoes:
    name: Funções da Vercel (compiladas como no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # vercel build local (sem token) e cada rota /api executada de verdade
      - run: npm run test:vercel

  navegador:
    name: Navegador (layout, acessibilidade, CSP, movimento)
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Testes em Chrome real
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:browser
      - name: Firefox e WebKit do Playwright
        run: npx playwright install --with-deps firefox webkit
      - name: Playwright (axe WCAG 2.1 AA, simulado em Chrome/Firefox/WebKit, regressão visual)
        env:
          CHROME_PATH: /usr/bin/google-chrome
          PW_TODOS: "1"
          CI: "1"
        run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (desempenho, acessibilidade, boas práticas)
    needs: qualidade
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
