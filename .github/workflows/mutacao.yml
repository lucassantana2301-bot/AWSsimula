name: Teste de mutação (semanal)

# Stryker nos módulos puros (stryker.config.json). Semanal e sob demanda: leva
# ~4 min e não precisa rodar em todo PR. Falha se o score cair abaixo de 60%.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutacao
  cancel-in-progress: true

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:mutation
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mutacao
          path: reports/mutation
          retention-days: 30
