name: Migrações do Supabase

# Manual de propósito: migração mexe no banco de produção e não volta atrás sozinha.
# 1. Rode com "aplicar" desmarcado: mostra o que seria aplicado (--dry-run).
# 2. Confira e rode de novo marcando "aplicar".
#
# Precisa de dois segredos no repositório (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  token pessoal (supabase.com/dashboard/account/tokens)
#   SUPABASE_DB_PASSWORD   senha do banco do projeto
# Sem eles o workflow avisa e para sem erro.
#
# Migrações aplicadas antes pelo SQL Editor não constam do histórico do CLI; marque-as uma vez:
#   npx supabase migration repair --status applied <versão> --linked
on:
  workflow_dispatch:
    inputs:
      aplicar:
        description: "Aplicar de verdade (desmarcado = só mostrar o que mudaria)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: migracoes
  cancel-in-progress: false

jobs:
  supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: producao
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJETO: htibjmqcxfbciqczfdrt
      # CLI pelo npm (mesmo registro das outras dependências), versão fixa
      CLI: supabase@3.1.0
    steps:
      - name: Segredos configurados?
        id: segredos
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::warning::Faltam SUPABASE_ACCESS_TOKEN e/ou SUPABASE_DB_PASSWORD nos segredos do repositório."
            echo "ok=false" >>"$GITHUB_OUTPUT"
          else
            echo "ok=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.segredos.outputs.ok == 'true'
        uses: actions/checkout@v4
      - if: steps.segredos.outputs.ok == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vincular ao projeto e listar o histórico
        if: steps.segredos.outputs.ok == 'true'
        run: |
          npx --yes "$CLI" link --project-ref "$PROJETO" --password "$SUPABASE_DB_PASSWORD"
          npx --yes "$CLI" migration list --linked
      - name: O que seria aplicado
        if: steps.segredos.outputs.ok == 'true' && !inputs.aplicar
        run: npx --yes "$CLI" db push --linked --dry-run --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar
        if: steps.segredos.outputs.ok == 'true' && inputs.aplicar
        run: npx --yes "$CLI" db push --linked --password "$SUPABASE_DB_PASSWORD"
